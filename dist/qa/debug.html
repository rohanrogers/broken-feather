<!doctype html><meta charset="utf-8"><title>Debug recorder and shotgun audio checks</title><style>body{font:14px system-ui;background:#173328;color:#fff3d6;padding:20px}button{padding:12px;background:#ffc35d;border:0;border-radius:7px;margin:4px}pre{white-space:pre-wrap;line-height:1.6}iframe{width:1300px;max-width:100%;height:850px;border:1px solid #aaa}</style><h1>Debug recorder & shotgun audio</h1><p>Synthetic hand input. Game audio muted. Audio checks render offline without speakers.</p><button id="debugRun">Test guided trials</button><button id="audioRun">Test audio offline</button><pre id="log">Ready.</pre><div id="frame"></div>
<script type="module">
import {ArcadeAudio} from '../audio.js?v=grip-16';
const log=document.querySelector('#log'),out=t=>log.textContent+='\n'+t,delay=ms=>new Promise(r=>setTimeout(r,ms));
async function until(check,label,timeout=12000){const start=performance.now();while(performance.now()-start<timeout){if(check()){out('PASS · '+label);return;}await delay(40);}throw Error(label);}
document.querySelector('#debugRun').onclick=async()=>{log.textContent='Testing ten manual shot attempts and separate guided aim exports…';document.querySelector('#debugRun').disabled=true;try{
 const source=(await(await fetch('../debug/',{cache:'no-store'})).text()).replace('<html lang="en">','<html lang="en" data-debug-test="true">');const frame=document.createElement('iframe');frame.title='Synthetic debug game';document.querySelector('#frame').replaceChildren(frame);frame.srcdoc=source.replace('<head>','<head><script type="importmap">{"imports":{"/camera.js?v=grip-16":"/qa/synthetic-camera.js?v=grip-16"}}<\/script>');await new Promise(r=>frame.onload=r);const doc=frame.contentDocument,$=id=>doc.getElementById(id);await until(()=>!$('debugShot').disabled,'debug database and UI ready');$('debugClearShots').click();$('debugClearAim').click();await delay(100);$('soundButton').click();$('startCamera').click();await until(()=>$('statusText').textContent.includes('HUNT IS LIVE'),'camera enters playable round');const remaining=$('timer').textContent;await delay(100);
 if(new URLSearchParams(location.search).has('spiral-preview')){$('debugAim').click();for(const title of ['RECTANGLE EDGES','X ACROSS THE FRAME','LARGE CIRCLE']){await until(()=>$('debugCue').textContent.includes(title),'preview guide '+title);$('debugDone').click();}await until(()=>$('debugCue').textContent.includes('EXPANDING SPIRAL'),'expanding spiral visible');out('PREVIEW · start tiny at centre and expand to the edges; Done remains manual');return;}

 $('debugShot').click();for(let i=1;i<=10;i++){await until(()=>$('debugCue').textContent.includes('SHOOT '+i+'/10'),'manual shot cue '+i);if(i===1){const before=$('weaponStatus').textContent;frame.contentWindow.postMessage({type:'test-flick'},location.origin);await until(()=>$('weaponStatus').textContent!==before,'injected unwanted shot registered');await until(()=>$('debugReady').textContent==='READY','ready after unwanted shot');await delay(650);}if(i!==4){await until(()=>$('debugReady').textContent==='READY','trigger ready');const before=$('weaponStatus').textContent;frame.contentWindow.postMessage({type:'test-flick'},location.origin);await until(()=>$('weaponStatus').textContent!==before,'shot registered');}else await delay(250);$('debugDone').click();await delay(100);}
 await until(()=>$('debugShotCount').textContent.startsWith('10/10'),'all ten manual attempts retained');const shots=JSON.parse($('debugFrameData').textContent);if(shots.mode!=='shooting'||shots.parts.length!==10||shots.parts[3].summary.actualShots!==0)throw Error('shot export lost an attempt or failure');if(shots.parts.some(p=>p.frames.some(f=>f.imageLandmarks&&f.imageLandmarks.length!==21)))throw Error('whole-hand coordinates missing');out('PASS · shooting export retains all ten attempts and the failed attempt');
 await until(()=>!$('debugAim').disabled,'last delayed frames collected');if(shots.shotReview?.unwantedShots!==1||shots.shotReview?.matchedByTiming!==9||shots.shotReview?.unmatchedAttempts!==1)throw Error('intended, missed and extra shots were not separated');out('PASS · nine timing matches, one missed intent, and one extra unwanted shot separated');$('debugAim').click();for(const [i,stage] of ['RECTANGLE EDGES','X ACROSS THE FRAME','LARGE CIRCLE','EXPANDING SPIRAL','PLUS ACROSS THE FRAME','RANDOM FREE AIMING','RETURN TO CENTRE'].entries()){await until(()=>$('debugCue').textContent.includes(stage),'aim guide '+stage);for(const yaw of [-.3,.3,0]){frame.contentWindow.postMessage({type:'test-aim',yaw,pitch:0},location.origin);await delay(100);}if(i===2){frame.contentWindow.postMessage({type:'test-flick'},location.origin);await delay(250);}$('debugDone').click();await delay(100);}
 await until(()=>$('debugAimCount').textContent.startsWith('7/7'),'all seven manual aim paths retained');const aim=JSON.parse($('debugFrameData').textContent);if(aim.mode!=='aim-only'||aim.parts.length!==7||aim.parts.some(p=>p.intendedShot))throw Error('aim-only export contains shot intentions');if(aim.parts[2].summary.unwantedShots!==1)throw Error('unwanted shot was not logged');$('debugView').value='shooting';$('debugView').dispatchEvent(new Event('change'));if(JSON.parse($('debugFrameData').textContent).parts.length!==10)throw Error('aim file overwrote shots');if($('timer').textContent!==remaining)throw Error('debug timer expired during manual sessions');out('PASS · rectangle, X, circle, expanding spiral, plus, random, centre and unintended shots remain in aim-only export');out('PASS · two exports remain separate; full-hand coordinates retained; timer waits for manual Done');$('pauseButton').click();out('ALL GUIDED DEBUG CHECKS PASSED');
}catch(e){out('FAIL · '+e.message);}finally{document.querySelector('#debugRun').disabled=false;}};
document.querySelector('#audioRun').onclick=async()=>{document.querySelector('#audioRun').disabled=true;try{
 const Offline=window.OfflineAudioContext||window.webkitOfflineAudioContext;if(!Offline)throw Error('Offline audio is unavailable');
 async function render(chamber,muted=false){const c=new Offline(1,44100,44100),audio=new ArcadeAudio();audio.context=c;audio.master=c.createGain();audio.master.gain.value=muted?0:.65;audio.master.connect(c.destination);audio.shot();audio.cycle({chamber});return (await c.startRendering()).getChannelData(0);}
 const rms=(data,start,end)=>{const samples=data.slice(Math.floor(start*44100),Math.floor(end*44100));return Math.sqrt(samples.reduce((s,v)=>s+v*v,0)/samples.length);};
 const normal=await render(true),empty=await render(false),silent=await render(true,true);if(rms(normal,0,.15)<.01)throw Error('shot missing');if(rms(normal,.19,.31)<.003)throw Error('rearward slide/ejection missing');if(rms(normal,.37,.52)<.003)throw Error('forward slide/chamber missing');if(rms(empty,.37,.52)>1e-7)throw Error('empty weapon chambered a shell');if(silent.some(v=>v!==0))throw Error('muted audio emitted samples');out('PASS · firing, rearward action and forward chamber have separate audible envelopes');out('PASS · empty last shot ejects without chambering');out('PASS · mute produces exactly silent output');out('ALL OFFLINE AUDIO CHECKS PASSED');
}catch(e){out('FAIL · '+e.message);}finally{document.querySelector('#audioRun').disabled=false;}};
</script>
