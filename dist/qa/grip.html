<!doctype html><meta charset="utf-8"><title>Gun poses and crosshair continuity</title><style>body{font:14px system-ui;background:#173328;color:#fff3d6;padding:20px}button{padding:12px;background:#ffc35d;border:0;border-radius:7px}pre{white-space:pre-wrap;line-height:1.6}iframe{width:1100px;max-width:100%;height:650px;border:1px solid #aaa}</style><h1>Gun poses & crosshair continuity</h1><p>Synthetic hand input. No webcam. Sound muted.</p><button id="run">Test one/two fingers and brief hand loss</button><pre id="log">Ready.</pre><div id="frame"></div>
<script type="module">
const log=document.querySelector('#log'),out=t=>log.textContent+='\n'+t,delay=ms=>new Promise(r=>setTimeout(r,ms));async function until(check,label){const start=performance.now();while(performance.now()-start<12000){if(check()){out('PASS · '+label);return;}await delay(15);}throw Error(label);}
document.querySelector('#run').onclick=async()=>{document.querySelector('#run').disabled=true;log.textContent='Testing visible aim independently from shooting grip…';try{const source=(await(await fetch('../index.html',{cache:'no-store'})).text()).replace('<html lang="en">','<html lang="en" data-qa-test="true">').replaceAll('src="./','src="/').replaceAll('href="./','href="/').replace('</body>','<output data-qa-telemetry hidden></output></body>');const iframe=document.createElement('iframe');iframe.title='Synthetic gun pose game';document.querySelector('#frame').replaceChildren(iframe);iframe.srcdoc=source.replace('<head>','<head><base href="/"><script type="importmap">{"imports":{"/camera.js?v=grip-16":"/qa/synthetic-camera.js?v=grip-16"}}<\/script>');await new Promise(r=>iframe.onload=r);const doc=iframe.contentDocument,$=id=>doc.getElementById(id),tele=()=>JSON.parse(doc.querySelector('output[data-qa-telemetry]').value||'{}'),send=data=>iframe.contentWindow.postMessage(data,location.origin);
$('soundButton').click();$('startCamera').click();await until(()=>tele().phase==='running'&&tele().armed,'one-finger pose calibrated and ready');send({type:'test-grip',value:'two'});await until(()=>tele().armed&&tele().aimVisible&&tele().gripVariant==='two-finger','two-finger gun stays ready with visible aim');const shells=$('weaponStatus').textContent;send({type:'test-flick'});await until(()=>$('weaponStatus').textContent!==shells,'two-finger upward flick fires');await until(()=>tele().armed,'ready after two-finger shot');send({type:'test-grip',value:'open'});await until(()=>tele().pose===false&&tele().aimValid&&tele().aimVisible,'relaxed grip keeps the crosshair visible while firing grip is rejected');send({type:'test-aim',yaw:.3,pitch:0});await until(()=>tele().aimX>.7,'finger steering continues without a shooting grip');const openShells=$('weaponStatus').textContent;send({type:'test-flick'});await delay(350);if($('weaponStatus').textContent!==openShells)throw Error('open hand fired');out('PASS · open hand movement does not shoot');
send({type:'test-grip',value:'one'});send({type:'test-aim',yaw:0,pitch:0});await until(()=>tele().armed,'one-finger gun returns to ready');await delay(250);send({type:'test-dropout',ms:180});await until(()=>tele().aimHeld,'brief missing frames hold the last crosshair position');if(!tele().aimVisible||tele().shotTracking||tele().armed)throw Error('held cursor authorizes firing or disappears');await until(()=>!tele().aimHeld&&tele().aimValid,'tracking returns without hiding the crosshair');out('PASS · held aim is visible but cannot authorize a shot');send({type:'test-hand',value:'missing'});await until(()=>!tele().aimVisible,'long hand loss expires the held cursor');send({type:'test-hand',value:'visible'});await until(()=>tele().aimVisible&&tele().armed,'valid returning hand resumes normal aim');$('pauseButton').click();out('ALL GUN POSE & CROSSHAIR CHECKS PASSED');}catch(e){out('FAIL · '+e.message);}finally{document.querySelector('#run').disabled=false;}};
</script>
