<!doctype html><meta charset="utf-8"><title>Chicken Shot performance check</title><style>body{font:14px system-ui;background:#173328;color:#fff3d6;padding:20px}button{padding:12px 20px;background:#ffc35d;border:0;border-radius:6px}pre{white-space:pre-wrap;line-height:1.7}iframe{width:1100px;max-width:100%;height:780px;border:1px solid #aaa}</style><h1>Camera-path performance check</h1><p>Synthetic camera plus the real model on a public sample. No webcam access.</p><button id="run">Run performance check</button><pre id="log">Ready.</pre><div id="frame"></div><script type="module">
const log=document.querySelector('#log'),delay=ms=>new Promise(r=>setTimeout(r,ms));
document.querySelector('#run').onclick=async()=>{document.querySelector('#run').disabled=true;log.textContent='Loading application…';let worker,observer;
try{const source=(await(await fetch('../index.html',{cache:'no-store'})).text()).replace('<html lang="en">','<html lang="en" data-qa-test="true">').replaceAll('src="./','src="/').replaceAll('href="./','href="/'),frame=document.createElement('iframe');frame.title='Performance test game';document.querySelector('#frame').replaceChildren(frame);frame.srcdoc=source.replace('<head>','<head><base href="/"><script type="importmap">{"imports":{"/camera.js?v=loading-17":"/qa/synthetic-camera.js?v=loading-17"}}<\/script>');await new Promise(r=>frame.onload=r);const doc=frame.contentDocument;doc.getElementById('soundButton').click();doc.getElementById('startCamera').click();await delay(4800);
log.textContent='Warming real inference worker…';worker=new Worker('../tracker-worker.js?v=loading-17',{type:'module'});const img=new Image();img.src='./right_hands.jpg';await img.decode();let inference=[],running=true,delegate='';let pending;
worker.onmessage=({data})=>{if(data.type==='ready'){delegate=data.delegate;pending?.();}else if(data.type==='result'){inference.push(data.inferenceMs);pending?.();}else if(data.type==='error'){log.textContent+='\nMODEL ERROR '+data.message;pending?.();}};
const ready=new Promise(r=>pending=r);worker.postMessage({type:'init',delegate:new URLSearchParams(location.search).get('delegate')||'GPU'});await ready;
async function infer(){const bitmap=await createImageBitmap(img);const result=new Promise(r=>pending=r);worker.postMessage({type:'frame',bitmap,timestamp:performance.now()},[bitmap]);await result;}
await infer();await infer();inference=[];let mutations=0,frames=[],previous=0,measuring=true;
observer=new MutationObserver(records=>mutations+=records.length);observer.observe(doc.body,{subtree:true,childList:true,attributes:true,characterData:true});
function tick(now){if(previous)frames.push(now-previous);previous=now;if(measuring)frame.contentWindow.requestAnimationFrame(tick);}frame.contentWindow.requestAnimationFrame(tick);
const start=performance.now();log.textContent='Measuring six seconds of camera UI + real inference…';while(performance.now()-start<6000){await infer();await delay(33);}measuring=false;observer.disconnect();worker.terminate();const seconds=(performance.now()-start)/1000,sorted=frames.sort((a,b)=>a-b),mean=frames.reduce((a,b)=>a+b,0)/frames.length;
log.textContent=JSON.stringify({seconds:+seconds.toFixed(2),renderFPS:+(1000/mean).toFixed(1),frameP95Ms:+(sorted[Math.floor(sorted.length*.95)]??0).toFixed(1),DOMMutationsPerSecond:Math.round(mutations/seconds),delegate,inferenceMeanMs:+(inference.reduce((a,b)=>a+b,0)/inference.length).toFixed(1),samples:inference.length},null,2);doc.getElementById('pauseButton').click();
}catch(e){log.textContent+='\nFAIL '+e.message;worker?.terminate();observer?.disconnect();}finally{document.querySelector('#run').disabled=false;}};
</script>
