<!doctype html><meta charset="utf-8"><title>Stationary hold verification</title><style>body{font:14px system-ui;background:#173328;color:#fff3d6;padding:20px}button{padding:12px;background:#ffc35d;border:0;border-radius:7px}pre{white-space:pre-wrap;line-height:1.6}iframe{width:1300px;max-width:100%;height:850px;border:1px solid #aaa}</style><h1>Stationary hold verification</h1><p>Synthetic landmarks. No webcam. Game sound muted.</p><button id="run">Test hold until Stop</button><pre id="log">Ready.</pre><div id="frame"></div>
<script type="module">
const log=document.querySelector('#log'),out=t=>log.textContent+='\n'+t,delay=ms=>new Promise(r=>setTimeout(r,ms));
async function until(check,label){const start=performance.now();while(performance.now()-start<12000){if(check()){out('PASS · '+label);return;}await delay(40);}throw Error(label);}
document.querySelector('#run').onclick=async()=>{document.querySelector('#run').disabled=true;log.textContent='Checking user-controlled stationary recording…';try{
const source=(await(await fetch('../debug/',{cache:'no-store'})).text()).replace('<html lang="en">','<html lang="en" data-debug-test="true">'),frame=document.createElement('iframe');frame.title='Synthetic hold-still game';document.querySelector('#frame').replaceChildren(frame);frame.srcdoc=source.replace('<head>','<head><script type="importmap">{"imports":{"/camera.js?v=loading-17":"/qa/synthetic-camera.js?v=loading-17"}}<\/script>');await new Promise(r=>frame.onload=r);const doc=frame.contentDocument,$=id=>doc.getElementById(id);
await until(()=>!$('debugStill').disabled,'three recording modes ready');$('debugClearStill').click();await delay(100);$('soundButton').click();$('startCamera').click();await until(()=>$('statusText').textContent.includes('HUNT IS LIVE'),'camera round running with muted sound');
await until(()=>$('debugLive').textContent.startsWith('no recoil detected'),'current tracking frame is in the running round');
const remaining=$('timer').textContent;$('debugStill').click();await until(()=>$('debugCue').textContent.includes('HOLD STILL'),'hold instruction visible');if(!$('debugDone').disabled)throw Error('Done can end the hold');if(!$('debugShot').disabled||!$('debugAim').disabled)throw Error('modes can overlap');
if(new URLSearchParams(location.search).has('preview')){out('PREVIEW · stationary hold is active until Stop');return;}
const cue=$('debugCue').textContent;await delay(1300);if($('debugCue').textContent!==cue||$('debugStop').disabled)throw Error('hold ended automatically');if($('timer').textContent!==remaining)throw Error('round time advanced while holding');out('PASS · hold continues, Done disabled, Stop enabled, round timer held');
frame.contentWindow.postMessage({type:'test-aim',yaw:.15,pitch:.08},location.origin);await delay(400);frame.contentWindow.postMessage({type:'test-flick'},location.origin);await until(()=>$('debugStillCount').textContent.includes('1 unwanted shots'),'unwanted shot retained during stationary intent');$('debugNote').value='Synthetic stationary intent with deliberate injected tracking drift and a false shot.';$('debugStop').click();await until(()=>!$('debugStillExport').disabled,'separate hold export available after Stop');const data=JSON.parse($('debugFrameData').textContent),part=data.parts[0];if(data.mode!=='stillness'||data.status!=='complete'||!data.stoppedByUser||data.mediaIncluded)throw Error('incorrect hold lifecycle');if(part.frames.some(f=>f.imageLandmarks?.length!==21||f.worldLandmarks?.length!==21))throw Error('whole-hand coordinates missing');if(part.summary.stillness.unwantedShots!==1||part.summary.stillness.channels['aim.x'].span<=0||!part.summary.stillness.channels['worldLandmarks.20.z'])throw Error('movement statistics missing');out('PASS · raw whole-hand samples, drift statistics, note and unwanted shot saved');
const oldClick=frame.contentWindow.HTMLAnchorElement.prototype.click;let fileName=null;try{frame.contentWindow.HTMLAnchorElement.prototype.click=function(){fileName=this.download;};$('debugStillExport').click();}finally{frame.contentWindow.HTMLAnchorElement.prototype.click=oldClick;}if(fileName!=='chickenshot-hold-still.json')throw Error('wrong export filename');out('PASS · chickenshot-hold-still.json remains separate from shooting and aim paths');$('pauseButton').click();out('ALL STATIONARY HOLD CHECKS PASSED');
}catch(e){out('FAIL · '+e.message);}finally{document.querySelector('#run').disabled=false;}};
</script>
