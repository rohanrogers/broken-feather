<!doctype html><html lang="en"><meta charset="utf-8"><title>Broken Feather tracking cache verification</title><style>body{background:#15362a;color:#fff3d6;padding:30px;font:15px system-ui}button{padding:12px 20px}pre{white-space:pre-wrap;line-height:1.8}</style><h1>Tracking cache verification</h1><p>Real bundled tracker, no webcam, no sound. Run again after refreshing to verify persistent reuse.</p><button id="run">Run cache checks</button><pre id="log">Ready.</pre><script type="module">
import {ensureTrackingCache} from '../tracking-cache.js?v=loading-17';
const log=document.querySelector('#log'),out=s=>log.textContent+='\n'+s;
async function tracker(){return new Promise((resolve,reject)=>{const worker=new Worker('../tracker-worker.js?v=loading-17',{type:'module'}),stages=[];const timer=setTimeout(()=>{worker.terminate();reject(Error('Tracker timeout'));},45000);worker.onmessage=({data})=>{if(data.type==='progress')stages.push(data.stage);if(data.type==='ready'||data.type==='error'){clearTimeout(timer);worker.terminate();data.type==='error'?reject(Error(data.message)):resolve(stages);}};worker.onerror=()=>{clearTimeout(timer);worker.terminate();reject(Error('Worker failed'));};worker.postMessage({type:'init'});});}
document.querySelector('#run').onclick=async()=>{document.querySelector('#run').disabled=true;log.textContent='Checking persistent model and runtime caching…';try{
 await ensureTrackingCache();if(!navigator.serviceWorker.controller?.scriptURL.endsWith('/tracking-cache-worker.js'))throw Error('Runtime cache service worker did not take control');out('PASS · tracking-only cache worker controls this page');
 const first=await tracker();out('PASS · first tracker initialized ('+(first.includes('cached')?'saved model':'downloaded model')+')');
 const cache=await caches.open('broken-feather-tracking-v1');const keys=await cache.keys();const runtime=keys.filter(key=>key.url.includes('/assets/mediapipe/'));if(!runtime.some(key=>key.url.includes('.wasm')))throw Error('WASM runtime not saved');out('PASS · '+runtime.length+' tracking runtime files cached, including WASM');
 const second=await tracker();if(!second.includes('cached')||second.includes('download'))throw Error('Second tracker downloaded the model');out('PASS · second tracker reused saved model without download');out('ALL CACHE CHECKS PASSED');
 }catch(error){out('FAIL · '+error.message);}finally{document.querySelector('#run').disabled=false;}};
</script></html>
